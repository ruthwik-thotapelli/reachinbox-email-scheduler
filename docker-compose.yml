version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: reachinbox
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: reachinbox
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
